<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sistema de Controle de Manutenção - Emteco Motores</title>

  <style>
    /* =========================================================
        CONFIGURAÇÃO GERAL
    ========================================================= */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #F3F4F6;
      font-family: Arial, sans-serif;
      color: #333;
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      overflow-x: hidden;
    }

    /* Sistema de Telas (Views) */
    .view {
      display: none;
    }
    .view.active {
      display: block;
    }

    /* =========================================================
        TELA INICIAL (HOME)
    ========================================================= */
    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 80px);
      padding: 20px;
      text-align: center;
    }

    .home-title {
      font-size: 1.8rem;
      color: #083173;
      margin-bottom: 40px;
      font-weight: bold;
    }

    .options-grid {
      display: flex;
      gap: 30px;
      max-width: 800px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card-option {
      background: #ffffff;
      border: 2px solid #D9DDE2;
      border-radius: 12px;
      padding: 40px 30px;
      width: 300px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .card-option:hover {
      border-color: #083173;
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(8,49,115,0.15);
    }

    .card-icon {
      font-size: 3rem;
    }

    .card-option span {
      font-size: 1.1rem;
      font-weight: bold;
      color: #083173;
    }

    /* =========================================================
        CABEÇALHO
    ========================================================= */
    .header {
      background: #083173;
      color: white;
      padding: 22px 35px;
      display: flex;
      align-items: center;
      border-bottom: 4px solid #D9D9D9;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo-text {
      font-size: 14px;
      font-weight: bold;
      margin-right: 30px;
      letter-spacing: 0.5px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    .btn-voltar-home {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-voltar-home:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* =========================================================
        CONTAINER E SEÇÕES
    ========================================================= */
    .container {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 25px 35px 100px;
    }

    .section {
      background: #FFFFFF;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .section-title {
      background: #D9D9D9;
      color: #083173;
      font-size: 15px;
      font-weight: bold;
      padding: 13px 18px;
      border-left: 6px solid #083173;
    }

    .section-content {
      padding: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .field {
      width: 100%;
      min-width: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #37474F;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #C9CDD3;
      border-radius: 5px;
      padding: 10px 11px;
      font-size: 14px;
      background: #FFFFFF;
      color: #333;
      outline: none;
      font-family: Arial, sans-serif;
    }

    input, select {
      height: 42px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #083173;
      box-shadow: 0 0 0 2px rgba(8, 49, 115, 0.08);
    }

    input:disabled, select:disabled, textarea:disabled {
      background-color: #E9ECEF;
      color: #6C757D;
      cursor: not-allowed;
    }

    .quantidade-area {
      margin-bottom: 20px;
    }

    .quantidade-area .field {
      width: 180px;
    }

    #produtosContainer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .produto-card {
      width: 100%;
      border: 1px solid #D9DDE2;
      border-radius: 7px;
      background: #FFFFFF;
      overflow: hidden;
    }

    .produto-titulo {
      background: #083173;
      color: #FFFFFF;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: bold;
    }

    .produto-content {
      padding: 18px;
    }

    .produto-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .produto-grid .full {
      grid-column: span 4;
    }

    /* =========================================================
        AÇÕES E BOTÕES INTERATIVOS
    ========================================================= */
    .acoes {
      position: sticky;
      bottom: 0;
      z-index: 50;
      width: 100%;
      background: #FFFFFF;
      border-top: 1px solid #D9DDE2;
      padding: 14px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);
    }

    .acoes button, .btn-salvar {
      min-height: 44px;
      border: none;
      border-radius: 5px;
      padding: 0 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-salvar:hover, .acoes button:hover {
      opacity: 0.9;
      filter: brightness(1.1);
    }

    .btn-salvar:active, .acoes button:active {
      transform: scale(0.98);
    }

    .btn-cancelar {
      background: #EEEEEE;
      color: #424242;
    }
    .btn-cancelar:hover {
      background: #DDDDDD;
    }

    .btn-salvar {
      background: #083173;
      color: #FFFFFF;
      min-width: 190px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 25px;
      font-size: 15px;
      color: #083173;
      font-weight: bold;
    }

    /* =========================================================
        RESPONSIVIDADE
    ========================================================= */
    @media (max-width: 768px) {
      .header {
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 15px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .header-left {
        width: 100%;
        justify-content: space-between;
      }
      .logo-text { display: none; }
      .container { padding: 10px 9px 15px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
      .produto-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- =========================================================
      TELA 1: MENU INICIAL (HOME)
  ========================================================= -->
  <div id="homeView" class="view active">
    <div class="home-container">
      <div class="home-title">Emteco Motores - Sistema de Manutenção</div>
      <div class="options-grid">
        <div class="card-option" onclick="mudarTela('novo')">
          <div class="card-icon">📝</div>
          <span>Novo Registro de Manutenção</span>
        </div>
      </div>
    </div>
  </div>

  <!-- =========================================================
      TELA 2: FORMULÁRIO PRINCIPAL
  ========================================================= -->
  <div id="formularioView" class="view">
    <header class="header">
      <div class="header-left">
        <span class="logo-text">EMTECO MOTORES</span>
        <div>
          <h1 id="tituloFormulario">Novo Registro de Manutenção</h1>
          <p>Preencha os dados da reclamação e controle técnico</p>
        </div>
      </div>
      <button class="btn-voltar-home" onclick="mudarTela('home')">⬅ Voltar ao Início</button>
    </header>

    <div class="container">
      <div id="loadingDados" class="loading">Carregando dados da planilha...</div>

      <!-- Formulário -->
      <form id="formManutencao" onsubmit="enviarFormulario(event)">
        
        <!-- Seção: Dados Gerais -->
        <div class="section">
          <div class="section-title">1. Dados Gerais da Reclamação</div>
          <div class="section-content grid-3">
            <div class="field">
              <label>Data da Reclamação *</label>
              <input type="date" id="dataReclamacao" required>
            </div>
            <div class="field">
              <label>Empresa / Cliente *</label>
              <input type="text" id="empresa" placeholder="Nome da empresa" required>
            </div>
            <div class="field">
              <label>Código Emteco</label>
              <input type="text" id="codigoEmteco" placeholder="Código do motor/produto">
            </div>
            <div class="field">
              <label>Data da Compra</label>
              <input type="date" id="dataCompra">
            </div>
            <div class="field">
              <label>Reclamação / Defeito Relatado *</label>
              <input type="text" id="reclamacaoDefeito" placeholder="Descrição do problema" required>
            </div>
            <div class="field">
              <label>Fase da Falha *</label>
              <select id="faseFalha" required><option value="">Selecione...</option></select>
            </div>
            <div class="field">
              <label>Modalidade *</label>
              <select id="modalidade" required><option value="">Selecione...</option></select>
            </div>
            <div class="field">
              <label>Número da Tarefa *</label>
              <input type="text" id="numeroTarefa" placeholder="Nº da Tarefa" required>
            </div>
          </div>
        </div>

        <!-- Seção: Produtos (Quantidade Dinâmica) -->
        <div class="section">
          <div class="section-title">2. Produtos Envolvidos</div>
          <div class="section-content">
            <div class="quantidade-area">
              <div class="field">
                <label>Quantidade de Produtos *</label>
                <input type="number" id="quantidade" min="1" value="1" onchange="gerarCardsProdutos()">
              </div>
            </div>
            <div id="produtosContainer"></div>
          </div>
        </div>

        <!-- Seção: Análise Técnica -->
        <div class="section">
          <div class="section-title">3. Análise Técnica e Pós-Teste</div>
          <div class="section-content grid-3">
            <div class="field">
              <label>Responsável Técnico *</label>
              <select id="responsavel" required><option value="">Selecione...</option></select>
            </div>
            <div class="field">
              <label>Data de Recebimento</label>
              <input type="date" id="dataRecebimento">
            </div>
            <div class="field">
              <label>Número de Controle</label>
              <input type="text" id="numeroControle" placeholder="Nº de Controle">
            </div>
            <div class="field">
              <label>Data do Teste</label>
              <input type="date" id="dataTeste">
            </div>
            <div class="field">
              <label>Item Movimentado</label>
              <select id="itemMovimentado"><option value="">Selecione...</option></select>
            </div>
            <div class="field">
              <label>Tipo de Estoque</label>
              <select id="tipoEstoque"><option value="">Selecione...</option></select>
            </div>
            <div class="field">
              <label>Data de Finalização</label>
              <input type="date" id="dataFinalizacao">
            </div>
            <div class="field">
              <label>Link do Vídeo</label>
              <input type="text" id="video" placeholder="URL do vídeo de teste">
            </div>
            <div class="field" style="grid-column: span 3;">
              <label>Observação Extra</label>
              <textarea id="observacaoExtra" placeholder="Observações adicionais"></textarea>
            </div>
            <div class="field" style="grid-column: span 3;">
              <label>Observação Fornecedor</label>
              <textarea id="observacaoFornecedor" placeholder="Comentários direcionados ao fornecedor"></textarea>
            </div>
          </div>
        </div>

        <!-- Botões de Ação Fixos -->
        <div class="acoes">
          <button type="button" class="btn-cancelar" onclick="mudarTela('home')">Cancelar</button>
          <button type="submit" class="btn-salvar" id="btnSalvar">Salvar Registro</button>
        </div>

      </form>
    </div>
  </div>

  <!-- =========================================================
      SCRIPTS E INTEGRAÇÃO COM BACKEND (.GS)
  ========================================================= -->
  <script>
    let opcoesSelects = {};

    function mudarTela(tipo) {
      document.getElementById('homeView').classList.remove('active');
      document.getElementById('formularioView').classList.remove('active');

      if (tipo === 'novo') {
        document.getElementById('tituloFormulario').innerText = "Novo Registro de Manutenção";
        document.getElementById('formManutencao').reset();
        document.getElementById('numeroTarefa').disabled = false;
        gerarCardsProdutos();
        document.getElementById('formularioView').classList.add('active');
        carregarOpcoesSelects();
      } else {
        document.getElementById('homeView').classList.add('active');
      }
    }

    function carregarOpcoesSelects() {
      document.getElementById('loadingDados').style.display = 'block';
      google.script.run
        .withSuccessHandler(dados => {
          opcoesSelects = dados;
          preencherSelect('faseFalha', dados.faseFalha);
          preencherSelect('modalidade', dados.modalidade);
          preencherSelect('responsavel', dados.responsavel);
          preencherSelect('itemMovimentado', dados.itemMovimentado);
          preencherSelect('tipoEstoque', dados.tipoEstoque);
          document.getElementById('loadingDados').style.display = 'none';
          
          atualizarSelectsProdutos();
        })
        .withFailureHandler(err => {
          document.getElementById('loadingDados').style.display = 'none';
          alert("Erro ao carregar opções da planilha: " + err.message);
        })
        .obterDadosFormulario();
    }

    function preencherSelect(id, itens) {
      const select = document.getElementById(id);
      if (!select) return;
      const valorAtual = select.value;
      select.innerHTML = '<option value="">Selecione...</option>';
      if (Array.isArray(itens)) {
        itens.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          select.appendChild(opt);
        });
      }
      select.value = valorAtual;
    }

    function gerarCardsProdutos() {
      const qtd = parseInt(document.getElementById('quantidade').value) || 1;
      const container = document.getElementById('produtosContainer');
      container.innerHTML = '';

      for (let i = 0; i < qtd; i++) {
        const card = document.createElement('div');
        card.className = 'produto-card';
        card.innerHTML = `
          <div class="produto-titulo">Produto ${i + 1}</div>
          <div class="produto-content">
            <div class="produto-grid">
              <div class="field">
                <label>Produto *</label>
                <select name="produto" required><option value="">Selecione...</option></select>
              </div>
              <div class="field">
                <label>Qualidade *</label>
                <select name="qualidade" required><option value="">Selecione...</option></select>
              </div>
              <div class="field">
                <label>Estoque Retirada *</label>
                <select name="estoqueRetirada" required><option value="">Selecione...</option></select>
              </div>
              <div class="field">
                <label>Código / Lote</label>
                <input type="text" name="codigoLote" placeholder="Lote do produto">
              </div>
              <div class="field full">
                <label>Defeito Identificado *</label>
                <select name="defeitoIdentificado" required><option value="">Selecione...</option></select>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
      atualizarSelectsProdutos();
    }

    function atualizarSelectsProdutos() {
      if (!opcoesSelects.produto) return;
      
      document.querySelectorAll('.produto-card').forEach(card => {
        preencherSelectElemento(card.querySelector('[name="produto"]'), opcoesSelects.produto);
        preencherSelectElemento(card.querySelector('[name="qualidade"]'), opcoesSelects.qualidade);
        preencherSelectElemento(card.querySelector('[name="estoqueRetirada"]'), opcoesSelects.estoque);
        preencherSelectElemento(card.querySelector('[name="defeitoIdentificado"]'), opcoesSelects.defeitoIdentificado);
      });
    }

    function preencherSelectElemento(select, itens) {
      if (!select) return;
      const valorAtual = select.value;
      select.innerHTML = '<option value="">Selecione...</option>';
      if (Array.isArray(itens)) {
        itens.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          select.appendChild(opt);
        });
      }
      select.value = valorAtual;
    }

    function enviarFormulario(event) {
      event.preventDefault();
      document.getElementById('btnSalvar').disabled = true;
      document.getElementById('loadingDados').style.display = 'block';

      const produtos = [];
      document.querySelectorAll('.produto-card').forEach(card => {
        produtos.push({
          produto: card.querySelector('[name="produto"]').value,
          qualidade: card.querySelector('[name="qualidade"]').value,
          estoqueRetirada: card.querySelector('[name="estoqueRetirada"]').value,
          codigoLote: card.querySelector('[name="codigoLote"]').value,
          defeitoIdentificado: card.querySelector('[name="defeitoIdentificado"]').value
        });
      });

      const dados = {
        dataReclamacao: document.getElementById('dataReclamacao').value,
        empresa: document.getElementById('empresa').value,
        codigoEmteco: document.getElementById('codigoEmteco').value,
        dataCompra: document.getElementById('dataCompra').value,
        reclamacaoDefeito: document.getElementById('reclamacaoDefeito').value,
        faseFalha: document.getElementById('faseFalha').value,
        modalidade: document.getElementById('modalidade').value,
        numeroTarefa: document.getElementById('numeroTarefa').value,
        quantidade: produtos.length,
        produtos: produtos,
        responsavel: document.getElementById('responsavel').value,
        dataRecebimento: document.getElementById('dataRecebimento').value,
        numeroControle: document.getElementById('numeroControle').value,
        dataTeste: document.getElementById('dataTeste').value,
        itemMovimentado: document.getElementById('itemMovimentado').value,
        tipoEstoque: document.getElementById('tipoEstoque').value,
        dataFinalizacao: document.getElementById('dataFinalizacao').value,
        video: document.getElementById('video').value,
        observacaoExtra: document.getElementById('observacaoExtra').value,
        observacaoFornecedor: document.getElementById('observacaoFornecedor').value
      };

      google.script.run
        .withSuccessHandler(res => {
          document.getElementById('loadingDados').style.display = 'none';
          document.getElementById('btnSalvar').disabled = false;
          alert(res.mensagem);
          mudarTela('home');
        })
        .withFailureHandler(err => {
          document.getElementById('loadingDados').style.display = 'none';
          document.getElementById('btnSalvar').disabled = false;
          alert("Erro ao salvar: " + err.message);
        })
        .salvarFormulario(dados);
    }

    window.onload = function() {
      gerarCardsProdutos();
    };
  </script>
</body>
</html>
